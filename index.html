<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rating Component</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="card bg-light rounded-4 border-0 mt-5 shadow-lg">
            <div class="card-body">
                <div class="row p-5">
                    <div class="col-7">
                        <h1>What others think about the product</h1>
                    </div>
                    <div class="col-5">
                        <div class="card">
                            <div class="card-body text-center">
                                <h3 class="display-5 fw-semibold"><i class="fa-solid fa-star text-warning"></i> 4.8</h3>
                                <p>Average Rating</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text rounded-start-5">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" class="form-control rounded-end-5" placeholder="Search Reviews">
                    </div>
                </div>

                <div class="row p-5">
                    <div class="card-body vstack gap-2">
                        <h2>Ratings</h2>
                        <!-- Level 5 -->
                        <div class="d-flex align-items-center gap-1">
                            <span>5 <i class="fa-solid fa-star text-warning"></i></span>
                            <div class="progress flex-grow-1" style="height: 10px" role="progressbar" aria-label="5 star rating" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-warning" style="width: 80%"></div>
                            </div>
                        </div>

                        <!-- Level 4 -->
                        <div class="d-flex align-items-center gap-1">
                            <span>4 <i class="fa-solid fa-star text-warning"></i></span>
                            <div class="progress flex-grow-1" style="height: 10px" role="progressbar" aria-label="4 star rating" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-warning" style="width: 60%"></div>
                            </div>
                        </div>

                        <!-- Level 3 -->
                        <div class="d-flex align-items-center gap-1">
                            <span>3 <i class="fa-solid fa-star text-warning"></i></span>
                            <div class="progress flex-grow-1" style="height: 10px" role="progressbar" aria-label="3 star rating" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-warning" style="width: 20%"></div>
                            </div>
                        </div>

                        <!-- Level 2 -->
                        <div class="d-flex align-items-center gap-1">
                            <span>2 <i class="fa-solid fa-star text-warning"></i></span>
                            <div class="progress flex-grow-1" style="height: 10px" role="progressbar" aria-label="2 star rating" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-warning" style="width: 10%"></div>
                            </div>
                        </div>

                        <!-- Level 1 -->
                        <div class="d-flex align-items-center gap-1">
                            <span>1 <i class="fa-solid fa-star text-warning"></i></span>
                            <div class="progress flex-grow-1" style="height: 10px" role="progressbar" aria-label="1 star rating" aria-valuenow="27" aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar bg-warning" style="width: 27%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row px-5 pb-4">
                    <div class="col-12">
                        <button type="button" class="btn btn-success btn-lg rounded-5">
                            Write Review
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
